<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5 Square Approximation</title>

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    body {
      background: #f5f7fa;
    }
    .app-wrap {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
    }
    .toolbar label {
      font-weight: 600;
    }
    .canvas-shell,
    .image-shell {
      background: white;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 12px;
    }
    .status {
      color: #555;
      font-size: 14px;
    }
    .random-image {
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      border: 1px solid #ddd;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eee;
      margin-top: 8px;
    }
    .image-shell {
      max-width: 444px;
      margin-bottom: 8px;
    }
    #sketch-holder-2 canvas {
      display: block;
      margin: 0 auto;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- CARD 1: imagen + botones genéticos (sin canvas) -->
    <div class="w3-card w3-white w3-padding-large w3-round-large w3-margin-bottom">
      <h1 class="w3-xlarge">Basic p5.js Square Approximation</h1>
      <p class="status">
        Generate a square-based population to start approximating the reference image with large pixel-like blocks.
      </p>

      <div class="image-shell w3-margin-top">
        <p class="status">Random photo</p>
        <img
          id="stockImage"
          class="random-image"
          src="https://cdn.britannica.com/34/235834-050-C5843610/two-different-breeds-of-cats-side-by-side-outdoors-in-the-garden.jpg?w=400&h=300&c=crop"
          alt="Two cats next to each other in a garden"
          width="400"
          height="300"
          loading="lazy"
        />
      </div>

      <div class="toolbar w3-margin-bottom">
        <button id="generarPoblacionBtn" class="w3-button w3-teal w3-round">
          Generar Población
        </button>
      </div>

      <!-- Canvas anterior eliminado -->
    </div>

    <!-- CARD 2: square approximation canvas -->
    <div class="w3-card w3-white w3-padding-large w3-round-large">
      <h2 class="w3-large">Square Approximation Canvas</h2>
      <p class="status">
        The generated population fills the full area with large pixel-like blocks.
      </p>

      <div class="canvas-shell">
        <div id="sketch-holder-2"></div>
      </div>
    </div>
  </div>

  <script>
    // Sketch 2: square-based approximation canvas
    const sketch2 = function (p) {
      let population = [];
      const cellSize = 25;

      function createFigure(x, y) {
        return {
          x,
          y,
          size: cellSize,
          color: p.color(
            p.random(40, 255),
            p.random(40, 255),
            p.random(40, 255),
            190
          )
        };
      }

      function drawFigure(figure) {
        p.noStroke();
        p.fill(figure.color);
        p.square(figure.x, figure.y, figure.size);
      }

      function redrawPopulation() {
        p.background(255);
        for (const figure of population) {
          drawFigure(figure);
        }
      }

      p.generateRandomFigures = function () {
        population = [];

        for (let y = 0; y < p.height; y += cellSize) {
          for (let x = 0; x < p.width; x += cellSize) {
            population.push(createFigure(x, y));
          }
        }

        redrawPopulation();
      };

      p.getPopulation = function () {
        return population;
      };

      p.setPopulation = function (newPopulation) {
        population = Array.isArray(newPopulation) ? newPopulation : [];
        redrawPopulation();
      };

      p.setup = function () {
        const canvas = p.createCanvas(400, 300);
        canvas.parent("sketch-holder-2");
        p.background(255);
      };

      document
        .getElementById("generarPoblacionBtn")
        .addEventListener("click", function () {
          p.generateRandomFigures();
        });
    };

    // Crear solo la instancia del segundo sketch
    const p5instance2 = new p5(sketch2);

    // hiperparámetros
    // pob: 30
    // mantenerla similar

  </script>
</body>
</html>
